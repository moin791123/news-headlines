<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>한줄뉴스</title>
<meta name="description" content="경제·부동산·주식 중심으로 국내외 주요 뉴스를 제목 한 줄로 모아 봅니다.">
<meta name="theme-color" content="#f4f5f7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#12151b" media="(prefers-color-scheme: dark)">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=IBM+Plex+Sans+KR:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* 레이아웃: 고정 헤더 + 분야 칩 + 분야별 한 줄 목록 카드(폰 1열, 태블릿 2열, 큰 화면 3열) */
:root {
  --bg: #f4f5f7;
  --surface: #ffffff;
  --ink: #161a21;
  --muted: #6a7180;
  --line: #e3e6eb;
  --hot: #d6372c;
  --link: #1f4fbf;
  --chip: #e9ecf1;
  --font-display: "Black Han Sans", "IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  --font-body: "IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif;
  --font-num: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #12151b; --surface: #1a1e26; --ink: #e7e9ee; --muted: #8d95a5;
    --line: #2a303b; --hot: #ff6b5e; --link: #8fb0ff; --chip: #252a34; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #12151b; --surface: #1a1e26; --ink: #e7e9ee; --muted: #8d95a5;
  --line: #2a303b; --hot: #ff6b5e; --link: #8fb0ff; --chip: #252a34; color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; }
body {
  background: var(--bg); color: var(--ink);
  font: 15px/1.5 var(--font-body);
  -webkit-font-smoothing: antialiased;
}
body::before {
  content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px);
  z-index: 10; background: var(--bg);
}
.wrap {
  max-width: 1400px; margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
header {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5;
  background: var(--bg);
  border-bottom: 1px solid var(--line);
}
.bar { display: flex; align-items: center; gap: 12px; padding-block: 12px 8px; }
.logo { font: 26px/1 var(--font-display); letter-spacing: -0.5px; margin: 0; white-space: nowrap; }
.iconbtn { white-space: nowrap; }
@media (max-width: 520px) { .bar { gap: 8px; } .logo { font-size: 23px; } .updated { font-size: 11.5px; } #refresh span { display: none; } }
.logo span { color: var(--hot); }
.updated { color: var(--muted); font-size: 12.5px; font-variant-numeric: tabular-nums; }
.spacer { flex: 1; }
.iconbtn {
  border: 1px solid var(--line); background: var(--surface); color: var(--ink);
  border-radius: 8px; height: 34px; padding: 0 12px; font: 500 13px var(--font-body);
  cursor: pointer; display: inline-flex; align-items: center; gap: 6px;
}
.iconbtn:hover { border-color: var(--muted); }
.iconbtn:focus-visible, .chip:focus-visible, .x:focus-visible, .title:focus-visible { outline: 2px solid var(--link); outline-offset: 2px; }
.chips { display: flex; gap: 6px; overflow-x: auto; padding-block: 2px 10px; scrollbar-width: none; }
.chips::-webkit-scrollbar { display: none; }
.chip {
  flex: none; border: 0; background: var(--chip); color: var(--ink);
  font: 500 13.5px var(--font-body); padding: 6px 12px; border-radius: 999px; cursor: pointer;
}
.chip[aria-pressed="true"] { background: var(--ink); color: var(--bg); }

main { padding-block: 16px 48px; }
.grid { display: grid; gap: 16px; grid-template-columns: 1fr; align-items: start; }
@media (min-width: 1100px) { .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); } }

section.box { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; min-width: 0; }
.box h2 {
  display: flex; align-items: baseline; gap: 8px; margin: 0;
  padding: 12px 14px 8px; font: 600 16px var(--font-body);
}
.box h2 small { color: var(--muted); font-weight: 400; font-size: 12px; letter-spacing: 0.3px; }
.box ul { list-style: none; margin: 0; padding: 0 0 6px; }
.box li {
  display: grid; grid-template-columns: auto minmax(0, 1fr) auto auto;
  align-items: center; gap: 8px; padding: 0 6px 0 14px; min-height: 40px;
  border-top: 1px solid var(--line);
  transition: opacity .25s, transform .25s;
}
.box li.gone { opacity: 0; transform: translateX(16px); }
.dot { width: 6px; height: 6px; border-radius: 50%; background: var(--line); }
.dot.hot { background: var(--hot); }
.title {
  color: var(--ink); text-decoration: none; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  padding-block: 9px;
}
.title:hover { color: var(--link); }
.title:visited { color: var(--muted); }
.tag { font-size: 11.5px; font-weight: 600; color: var(--link); margin-right: 6px; }
.meta { color: var(--muted); font-size: 12px; white-space: nowrap; font-variant-numeric: tabular-nums; }
.meta .src { margin-right: 6px; }
@media (max-width: 520px) { .meta .src { display: none; } }
.x {
  border: 0; background: transparent; color: var(--muted); width: 32px; height: 32px; border-radius: 6px;
  cursor: pointer; font-size: 17px; line-height: 1;
}
.x:hover { background: var(--chip); color: var(--ink); }
.more { display: block; width: 100%; border: 0; border-top: 1px solid var(--line); background: none; color: var(--muted); font: 500 13px var(--font-body); padding: 10px; cursor: pointer; border-radius: 0 0 12px 12px; }
.more:hover { color: var(--ink); }
.empty { color: var(--muted); padding: 14px; margin: 0; border-top: 1px solid var(--line); font-size: 13.5px; }

.status { color: var(--muted); padding: 40px 0; text-align: center; }

.toast {
  position: fixed; left: 50%; transform: translateX(-50%);
  bottom: calc(16px + env(safe-area-inset-bottom, 0px));
  background: var(--ink); color: var(--bg); border-radius: 10px; padding: 10px 14px;
  display: flex; gap: 14px; align-items: center; font-size: 14px; z-index: 20;
  max-width: calc(100% - 32px); box-shadow: 0 6px 24px rgba(0,0,0,.18);
}
.toast button { border: 0; background: none; color: inherit; font: 600 14px var(--font-body); text-decoration: underline; cursor: pointer; padding: 0; }

.panel-back { position: fixed; inset: 0; background: rgba(10,12,16,.45); z-index: 30; display: flex; justify-content: flex-end; }
.panel {
  width: min(420px, 100%); height: 100%; overflow-y: auto; background: var(--surface);
  padding: calc(16px + env(safe-area-inset-top, 0px)) max(18px, env(safe-area-inset-right, 0px)) calc(24px + env(safe-area-inset-bottom, 0px)) 18px;
}
.panel h3 { font: 600 17px var(--font-body); margin: 0 0 4px; }
.panel h4 { font: 600 14px var(--font-body); margin: 22px 0 8px; }
.panel p { color: var(--muted); font-size: 13.5px; margin: 0; }
.wrow { display: grid; grid-template-columns: 110px 1fr 42px; gap: 10px; align-items: center; font-size: 13.5px; padding: 4px 0; }
.wbar { height: 6px; background: var(--chip); border-radius: 3px; overflow: hidden; }
.wbar i { display: block; height: 100%; background: var(--link); }
.wrow .num { text-align: right; font: 500 12px var(--font-num); color: var(--muted); }
.kws { display: flex; flex-wrap: wrap; gap: 6px; }
.kw { border: 0; background: var(--chip); color: var(--ink); border-radius: 999px; padding: 4px 10px; font: 13px var(--font-body); cursor: pointer; }
.kw:hover { text-decoration: line-through; }
.panel .actions { display: flex; gap: 8px; margin-top: 24px; flex-wrap: wrap; }
.danger { color: var(--hot); }
@media (prefers-reduced-motion: reduce) { .box li { transition: none; } }
</style>
</head>
<body>
<header>
  <div class="wrap">
    <div class="bar">
      <h1 class="logo">한줄<span>뉴스</span></h1>
      <span class="updated" id="updated"></span>
      <span class="spacer"></span>
      <button class="iconbtn" id="refresh" type="button" title="새로고침">↻ <span>새로고침</span></button>
      <button class="iconbtn" id="openPrefs" type="button">내 취향</button>
    </div>
    <nav class="chips" id="chips" aria-label="분야 선택"></nav>
  </div>
</header>
<main class="wrap">
  <div class="grid" id="grid"><p class="status">뉴스를 불러오는 중입니다…</p></div>
</main>
<div id="toast" class="toast" hidden role="status"></div>
<div id="panelBack" class="panel-back" hidden></div>

<script>
(() => {
  "use strict";
  const DATA_URL = "news.json";
  const PREF_KEY = "hanjul.prefs.v1";
  // 분야별 기본 표시 개수 (관심이 줄면 이 숫자도 줄어듭니다)
  const BASE_COUNT = { kr_econ: 10, realestate: 10, stock: 10, world_econ: 10, world: 7, ent: 6, society: 7, football: 8 };
  const FILTERS = [
    { id: "all", name: "전체" },
    { id: "국내", name: "국내 경제" },
    { id: "해외", name: "해외" },
    { id: "이슈", name: "연예·사회" },
    { id: "축구", name: "유럽 축구" },
  ];
  const STOP = new Set(("속보 단독 종합 오늘 내일 어제 기자 뉴스 이번 대한 관련 위해 이후 올해 지난 사진 영상 포토 " +
    "가운데 통해 대해 따라 있다 없다 했다 한다 하는 있는 위한 만에 이상 이하 최대 최고 최저 사상 첫 결국 " +
    "the and for with from that this").split(" "));
  const PARTICLES = /(에서는|에서|으로는|으로|에게|까지|부터|보다|처럼|이라|라는|이란|에는|과의|와의|은|는|이|가|을|를|의|에|로|와|과|도|만)$/;

  let data = null;
  let filter = "all";
  const expanded = new Set();
  let prefs = loadPrefs();

  function loadPrefs() {
    const empty = { cat: {}, kw: {}, hidden: {}, dislikes: 0 };
    try {
      const p = JSON.parse(localStorage.getItem(PREF_KEY) || "null");
      if (p && typeof p === "object") return Object.assign(empty, p);
    } catch (e) {}
    return empty;
  }
  function savePrefs() {
    try {
      const week = Date.now() - 7 * 864e5;
      for (const [id, t] of Object.entries(prefs.hidden)) if (t < week) delete prefs.hidden[id];
      localStorage.setItem(PREF_KEY, JSON.stringify(prefs));
    } catch (e) {}
  }
  try { filter = localStorage.getItem("hanjul.filter") || "all"; } catch (e) {}

  function tokens(title) {
    const clean = title.replace(/\[[^\]]*\]|\([^)]*\)|【[^】]*】/g, " ");
    const out = [];
    for (let w of clean.match(/[가-힣A-Za-z0-9]{2,}/g) || []) {
      w = w.toLowerCase();
      if (/[가-힣]/.test(w) && w.length > 2) w = w.replace(PARTICLES, "");
      if (w.length < 2 || STOP.has(w) || /^\d+$/.test(w)) continue;
      if (!out.includes(w)) out.push(w);
      if (out.length >= 8) break;
    }
    return out;
  }
  const catW = (c) => prefs.cat[c] ?? 1;
  function kwPenalty(it) {
    let s = 0;
    for (const t of it._tok) s += Math.min(2, prefs.kw[t] || 0);
    return s;
  }
  function score(it) {
    const ageH = (Date.now() / 1000 - it.ts) / 3600;
    const fresh = 2.5 * Math.exp(-Math.max(0, ageH) / 10);
    return (it.hot + fresh) * catW(it.cat) - 0.7 * kwPenalty(it);
  }

  function ago(ts) {
    const m = Math.max(0, Math.round((Date.now() / 1000 - ts) / 60));
    if (m < 60) return m <= 1 ? "방금" : m + "분 전";
    const h = Math.round(m / 60);
    if (h < 24) return h + "시간 전";
    return Math.round(h / 24) + "일 전";
  }
  function fmtUpdated(iso) {
    const d = new Date(iso);
    if (isNaN(d)) return "";
    const p = (n) => String(n).padStart(2, "0");
    return `${d.getMonth() + 1}/${d.getDate()} ${p(d.getHours())}:${p(d.getMinutes())} 기준`;
  }

  const el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; };

  function renderChips() {
    const box = document.getElementById("chips");
    box.replaceChildren();
    for (const f of FILTERS) {
      const b = el("button", "chip", f.name);
      b.type = "button";
      b.setAttribute("aria-pressed", String(filter === f.id));
      b.addEventListener("click", () => {
        filter = f.id;
        try { localStorage.setItem("hanjul.filter", filter); } catch (e) {}
        renderChips(); render();
      });
      box.append(b);
    }
  }

  function render() {
    const grid = document.getElementById("grid");
    if (!data) return;
    grid.replaceChildren();
    const cats = data.categories.filter((c) => filter === "all" || c.group === filter);
    // 관심이 많이 줄어든 분야는 뒤로 보냅니다
    const ordered = cats.map((c, i) => ({ c, i })).sort((a, b) => {
      const la = catW(a.c.id) < 0.55, lb = catW(b.c.id) < 0.55;
      return la === lb ? a.i - b.i : la ? 1 : -1;
    }).map((x) => x.c);

    for (const c of ordered) {
      const list = data.items
        .filter((it) => it.cat === c.id && !prefs.hidden[it.id] && kwPenalty(it) < 4)
        .map((it) => ({ it, s: score(it) }))
        .sort((a, b) => b.s - a.s)
        .map((x) => x.it);
      const base = BASE_COUNT[c.id] || 8;
      const count = expanded.has(c.id) ? list.length : Math.max(2, Math.round(base * Math.min(1.2, catW(c.id))));
      const shown = list.slice(0, count);
      const hotCut = hotThreshold();

      const sec = el("section", "box");
      sec.dataset.cat = c.id;
      const h = el("h2", null, c.name);
      h.append(el("small", null, c.group === "축구" ? "영국·스페인·독일·프랑스" : c.group));
      sec.append(h);
      if (!shown.length) {
        sec.append(el("p", "empty", "지금 보여드릴 기사가 없습니다."));
      } else {
        const ul = el("ul");
        for (const it of shown) ul.append(row(it, hotCut));
        sec.append(ul);
      }
      if (list.length > count || expanded.has(c.id)) {
        const more = el("button", "more", expanded.has(c.id) ? "접기" : `더보기 (${list.length - count})`);
        more.type = "button";
        more.addEventListener("click", () => { expanded.has(c.id) ? expanded.delete(c.id) : expanded.add(c.id); render(); });
        sec.append(more);
      }
      grid.append(sec);
    }
  }

  let _hot = null;
  function hotThreshold() {
    if (_hot != null) return _hot;
    const hs = data.items.map((i) => i.hot).sort((a, b) => b - a);
    _hot = hs[Math.floor(hs.length * 0.12)] ?? Infinity;
    return _hot;
  }

  function row(it, hotCut) {
    const li = el("li");
    li.dataset.id = it.id;
    const dot = el("span", "dot" + (it.hot >= hotCut ? " hot" : ""));
    if (it.hot >= hotCut) dot.title = "많이 보도되는 기사";
    const a = el("a", "title");
    a.href = it.url; a.target = "_blank"; a.rel = "noopener noreferrer";
    a.title = it.title + (it.source ? " · " + it.source : "");
    if (it.tag) a.append(el("span", "tag", it.tag));
    a.append(document.createTextNode(it.title));
    a.addEventListener("click", () => like(it));
    const meta = el("span", "meta");
    if (it.source) meta.append(el("span", "src", it.source));
    meta.append(document.createTextNode(ago(it.ts)));
    const x = el("button", "x", "✕");
    x.type = "button";
    x.title = "관심없음"; x.setAttribute("aria-label", "관심없음: " + it.title);
    x.addEventListener("click", () => dislike(it, li));
    li.append(dot, a, meta, x);
    return li;
  }

  // 기사를 클릭하면 그 분야와 단어에 대한 관심을 조금 올립니다.
  function like(it) {
    prefs.cat[it.cat] = Math.min(1.3, catW(it.cat) * 1.03 + 0.01);
    for (const t of it._tok) if (prefs.kw[t]) prefs.kw[t] = Math.max(0, prefs.kw[t] - 0.3) || undefined;
    savePrefs();
  }

  // 관심없음: 기사를 숨기고 분야 비중과 제목 단어 점수를 낮춥니다.
  let undo = null;
  function dislike(it, li) {
    const before = JSON.stringify(prefs);
    prefs.hidden[it.id] = Date.now();
    prefs.cat[it.cat] = Math.max(0.25, +(catW(it.cat) * 0.87).toFixed(3));
    for (const t of it._tok) prefs.kw[t] = +((prefs.kw[t] || 0) + 0.5).toFixed(2);
    prefs.dislikes = (prefs.dislikes || 0) + 1;
    savePrefs();
    undo = before;
    li.classList.add("gone");
    setTimeout(render, 230);
    showToast("이런 뉴스는 점점 덜 보여드릴게요", "되돌리기", () => {
      try { prefs = Object.assign({ cat: {}, kw: {}, hidden: {}, dislikes: 0 }, JSON.parse(undo)); } catch (e) {}
      savePrefs(); render();
    });
  }

  let toastTimer;
  function showToast(msg, actionLabel, action) {
    const t = document.getElementById("toast");
    t.replaceChildren(el("span", null, msg));
    if (actionLabel) {
      const b = el("button", null, actionLabel);
      b.type = "button";
      b.addEventListener("click", () => { t.hidden = true; action(); });
      t.append(b);
    }
    t.hidden = false;
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => (t.hidden = true), 5000);
  }

  // 내 취향 패널
  function openPrefs() {
    const back = document.getElementById("panelBack");
    const p = el("div", "panel");
    p.setAttribute("role", "dialog"); p.setAttribute("aria-label", "내 취향");
    const head = el("div", null);
    head.style.cssText = "display:flex;align-items:center;gap:8px";
    const h = el("h3", null, "내 취향"); h.style.flex = "1";
    const close = el("button", "iconbtn", "닫기"); close.type = "button";
    close.addEventListener("click", closePrefs);
    head.append(h, close);
    p.append(head, el("p", null, `관심없음을 ${prefs.dislikes || 0}번 누르셨어요. 누를수록 비슷한 분야와 단어가 들어간 기사가 덜 보입니다. 이 설정은 이 기기의 브라우저에만 저장됩니다.`));

    p.append(el("h4", null, "분야별 비중"));
    for (const c of (data ? data.categories : [])) {
      const r = el("div", "wrow");
      const bar = el("div", "wbar"); const i = el("i"); i.style.width = Math.round(Math.min(1.3, catW(c.id)) / 1.3 * 100) + "%"; bar.append(i);
      r.append(el("span", null, c.name), bar, el("span", "num", Math.round(catW(c.id) * 100) + "%"));
      p.append(r);
    }

    p.append(el("h4", null, "덜 보고 싶은 단어"));
    const kws = Object.entries(prefs.kw).filter(([, v]) => v > 0).sort((a, b) => b[1] - a[1]).slice(0, 40);
    if (!kws.length) p.append(el("p", null, "아직 없습니다. 기사 옆 ✕ 를 누르면 여기에 쌓입니다."));
    else {
      p.append(el("p", null, "단어를 누르면 목록에서 빠집니다."));
      const box = el("div", "kws"); box.style.marginTop = "8px";
      for (const [k, v] of kws) {
        const b = el("button", "kw", `${k} ${v >= 2 ? "(강하게)" : ""}`.trim()); b.type = "button";
        b.addEventListener("click", () => { delete prefs.kw[k]; savePrefs(); render(); b.remove(); });
        box.append(b);
      }
      p.append(box);
    }

    const act = el("div", "actions");
    const reset = el("button", "iconbtn danger", "학습 초기화"); reset.type = "button";
    reset.addEventListener("click", () => {
      if (reset.dataset.confirm) {
        prefs = { cat: {}, kw: {}, hidden: {}, dislikes: 0 }; savePrefs(); render(); closePrefs();
        showToast("학습 내용을 모두 지웠습니다");
      } else { reset.dataset.confirm = "1"; reset.textContent = "한 번 더 누르면 초기화됩니다"; }
    });
    act.append(reset);
    p.append(act);

    back.replaceChildren(p);
    back.hidden = false;
    close.focus();
  }
  function closePrefs() { document.getElementById("panelBack").hidden = true; }
  document.getElementById("panelBack").addEventListener("click", (e) => { if (e.target.id === "panelBack") closePrefs(); });
  document.addEventListener("keydown", (e) => { if (e.key === "Escape") closePrefs(); });
  document.getElementById("openPrefs").addEventListener("click", openPrefs);

  async function load(manual) {
    try {
      const r = await fetch(DATA_URL + "?t=" + Date.now(), { cache: "no-store" });
      if (!r.ok) throw new Error(r.status);
      const d = await r.json();
      for (const it of d.items) it._tok = tokens(it.title);
      data = d; _hot = null;
      document.getElementById("updated").textContent = fmtUpdated(d.updated);
      render();
      if (manual) showToast("최신 뉴스로 바꿨습니다");
    } catch (e) {
      if (!data) document.getElementById("grid").replaceChildren(el("p", "status", "뉴스를 불러오지 못했습니다. 잠시 후 새로고침을 눌러 주세요."));
      else if (manual) showToast("새 뉴스를 불러오지 못했습니다. 잠시 후 다시 눌러 주세요.");
    }
  }
  document.getElementById("refresh").addEventListener("click", () => load(true));
  // 화면을 켜둔 동안 10분마다, 다시 돌아왔을 때도 새로 불러옵니다.
  setInterval(() => { if (!document.hidden) load(false); }, 10 * 60 * 1000);
  let lastHide = 0;
  document.addEventListener("visibilitychange", () => {
    if (document.hidden) lastHide = Date.now();
    else if (Date.now() - lastHide > 5 * 60 * 1000) load(false);
  });

  renderChips();
  load(false);
})();
</script>
</body>
</html>
